<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chris Proctor</title>
  <meta name="description" content="UCSB Baseball Stats" />
  <style>
    :root {
      --ucsb-blue: #003660;
      --ucsb-gold: #FEBC11;
      --ink: #1a1a1a;
      --muted: #5a5a5a;
      --bg: #fafafa;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 56px 24px 28px;
      text-align: center;
      border-bottom: 2px solid var(--ucsb-blue);
    }
    header h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ucsb-blue);
    }
    header p {
      margin: 0;
      color: var(--ucsb-gold);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 64px;
    }
    .tile {
      display: block;
      padding: 56px 48px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      text-decoration: none;
      color: var(--ink);
      text-align: center;
      max-width: 400px;
      width: 100%;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .tile:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
      border-color: var(--ucsb-gold);
    }
    .tile .icon img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 16px;
    }
    .tile h2 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      color: var(--ucsb-blue);
    }
    .tile p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    footer {
      text-align: center;
      padding: 16px 24px 24px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>ChrisProctor.org</h1>
  </header>
  <main>
    <a class="tile" href="/UCSBbaseballstats/">
      <div class="icon"><img src="photos/ucsb-baseball-logo.png" alt="UCSB Baseball"></div>
      <h2>UCSB Baseball Stats</h2>
      <p>Live player stats for UCSB Gauchos baseball.</p>
    </a>
  </main>
  <footer>© <span id="year"></span> chrisproctor.org</footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>

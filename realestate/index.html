<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real Estate — Chris Proctor</title>
  <meta name="description" content="Property listings: Santa Barbara, Isla Vista, San Luis Obispo, Honolulu" />
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #5a5a5a;
      --bg: #fafafa;
      --border: #e5e7eb;
      --accent: #003660;
      --gold: #FEBC11;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .topbar {
      background: var(--accent);
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .topbar a { color: var(--gold); text-decoration: none; font-weight: 600; }
    .topbar .title { font-size: 1.1rem; font-weight: 700; }
    main { max-width: 1200px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      letter-spacing: -0.02em;
    }
    .subtitle { color: var(--muted); margin: 0 0 28px; }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .controls button {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: white;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }
    .controls button.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
    }
    .photo {
      aspect-ratio: 16 / 10;
      width: 100%;
      background-size: cover;
      background-position: center;
      background-color: #e5e7eb;
      position: relative;
    }
    .photo .pill {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 54, 96, 0.92);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .body { padding: 18px 20px 22px; flex: 1; display: flex; flex-direction: column; }
    .body h3 {
      margin: 0 0 4px;
      font-size: 1.15rem;
      color: var(--accent);
    }
    .city { color: var(--muted); font-size: 0.9rem; margin: 0 0 12px; }
    .meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .meta span strong { color: var(--ink); }
    .desc { font-size: 0.92rem; color: #333; margin: 0 0 14px; line-height: 1.5; flex: 1; }
    .map-link {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .map-link:hover { text-decoration: underline; }
    .photo iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      position: absolute;
      top: 0; left: 0;
    }
    .photo { position: relative; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="title">🏠 Real Estate</span>
    <a href="/">← Home</a>
  </div>
  <main>
    <h1>Properties</h1>
    <p class="subtitle">A portfolio of rentals in California and Hawaii.</p>

    <div class="controls" id="filters">
      <button class="active" data-region="all">All</button>
      <button data-region="Santa Barbara">Santa Barbara</button>
      <button data-region="Isla Vista">Isla Vista</button>
      <button data-region="San Luis Obispo">San Luis Obispo</button>
      <button data-region="Mammoth Lakes">Mammoth Lakes</button>
      <button data-region="Honolulu">Honolulu</button>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <script>
    const properties = [
      {
        name: "Ladera St Apartments",
        city: "Santa Barbara",
        region: "Santa Barbara",
        state: "CA",
        description: "Multi-unit apartment building in the heart of Santa Barbara, walking distance to downtown and the beach.",
        photo: "../photos/Ladera-web.jpg",
        mapQuery: "203 Ladera St, Santa Barbara, CA"
      },
      {
        name: "Camino Del Sur",
        city: "Isla Vista",
        region: "Isla Vista",
        state: "CA",
        description: "UCSB student rental near campus on Camino Del Sur. High-demand college town location.",
        photo: "../photos/CaminoDelSur-web.jpg",
        mapQuery: "930 Camino Del Sur, Isla Vista, CA"
      },
      {
        name: "Sueno",
        city: "Isla Vista",
        region: "Isla Vista",
        state: "CA",
        description: "Sueno Road property steps from UCSB. Classic Isla Vista student housing.",
        photo: "../photos/Sueno-web.jpg",
        mapQuery: "6652 Sueno Rd, Isla Vista, CA"
      },
      {
        name: "Sabado Tarde",
        city: "Isla Vista",
        region: "Isla Vista",
        state: "CA",
        description: "Sabado Tarde rental in the heart of UCSB's student neighborhood, blocks from campus and the bluffs.",
        photo: "../photos/SabadoTarde-web.jpg",
        mapQuery: "Sabado Tarde Rd, Isla Vista, CA"
      },
      {
        name: "Casa St Apartments",
        city: "San Luis Obispo",
        region: "San Luis Obispo",
        state: "CA",
        description: "Multi-unit apartment building in San Luis Obispo, serving Cal Poly students and locals.",
        photo: "../photos/casa-web.jpg",
        mapQuery: "60 Casa St, San Luis Obispo, CA"
      },
      {
        name: "John Muir Rd",
        city: "Mammoth Lakes",
        region: "Mammoth Lakes",
        state: "CA",
        description: "Unit A at 422 John Muir Rd in Mammoth Lakes — a mountain retreat near world-class ski resorts and outdoor recreation.",
        photo: "../photos/JohnMuir2-web.jpg",
        mapQuery: "422 John Muir Rd, Unit A, Mammoth Lakes, CA"
      },
      {
        name: "Ilikai Marina",
        city: "Honolulu",
        region: "Honolulu",
        state: "HI",
        description: "Condo at the Ilikai Marina overlooking the Ala Wai Harbor and Waikiki Beach.",
        photo: "../photos/ilikai.jpg",
        mapQuery: "1765 Ala Moana Blvd, unit 1594, Honolulu, HI"
      }
    ];

    const grid = document.getElementById('grid');
    const filters = document.getElementById('filters');

    function render(region = 'all') {
      const list = region === 'all' ? properties : properties.filter(p => p.region === region);
      grid.innerHTML = list.map(p => `
        <article class="card">
          <div class="photo" ${!p.useMapEmbed ? `style="background-image:url('${p.photo}')"` : ''}>
            ${p.useMapEmbed ? `<iframe
              src="https://maps.google.com/maps?q=${encodeURIComponent(p.mapQuery)}&output=embed&z=17"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              title="${p.name} map"
            ></iframe>` : ''}
            <span class="pill">${p.region}</span>
          </div>
          <div class="body">
            <h3>${p.name}</h3>
            <p class="city">${p.city}, ${p.state}</p>
            <p class="desc">${p.description}</p>
            <a class="map-link" target="_blank" rel="noopener"
               href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.mapQuery)}">
              View on Google Maps →
            </a>
          </div>
        </article>
      `).join('');
    }

    filters.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      filters.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render(btn.dataset.region);
    });

    render();
  </script>
</body>
</html>

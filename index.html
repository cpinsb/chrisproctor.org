<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chris Proctor</title>
  <meta name="description" content="UCSB Baseball Stats and Real Estate" />
  <style>
    :root {
      --ucsb-blue: #003660;
      --ucsb-gold: #FEBC11;
      --ink: #1a1a1a;
      --muted: #5a5a5a;
      --bg: #fafafa;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 56px 24px 28px;
      text-align: center;
      border-bottom: 2px solid var(--ucsb-blue);
    }
    header h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ucsb-blue);
    }
    header p {
      margin: 0;
      color: var(--ucsb-gold);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px 64px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 880px;
      width: 100%;
    }
    .tile {
      display: block;
      padding: 56px 32px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      text-decoration: none;
      color: var(--ink);
      text-align: center;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .tile:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
      border-color: var(--ucsb-gold);
    }
    .tile .icon {
      font-size: 3rem;
      margin-bottom: 16px;
      line-height: 1;
    }
    .tile h2 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      color: var(--ucsb-blue);
    }
    .tile p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .contact-section {
      background: white;
      padding: 24px 24px;
      margin-top: 24px;
      border-top: 2px solid var(--ucsb-blue);
    }
    .contact-section h2 {
      margin: 0 0 16px;
      font-size: 1.3rem;
      color: var(--ucsb-blue);
      text-align: center;
      font-weight: 700;
    }
    .contact-form {
      max-width: 500px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--ink);
      font-size: 0.95rem;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      color: var(--ink);
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--ucsb-blue);
      box-shadow: 0 0 0 3px rgba(0, 54, 96, 0.1);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }
    .submit-btn {
      width: 100%;
      padding: 12px 24px;
      background: var(--ucsb-blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .submit-btn:hover {
      background: #002a4a;
      transform: translateY(-2px);
    }
    .submit-btn:active {
      transform: translateY(0);
    }
    footer {
      text-align: center;
      padding: 16px 24px 24px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Chris Proctor</h1>
    <p>Real Estate</p>
  </header>
  <main>
    <div class="grid">
      <a class="tile" href="/realestate/">
        <div class="icon">🏠</div>
        <h2>Real Estate</h2>
        <p>Browse properties in Santa Barbara, Isla Vista, San Luis Obispo, Mammoth Lakes, and Honolulu.</p>
      </a>
      <a class="tile" href="/UCSBbaseballstats/">
        <div class="icon">⚾</div>
        <h2>UCSB Baseball Stats</h2>
        <p>Live player stats for UCSB baseball.</p>
      </a>
    </div>
  </main>
  <section class="contact-section">
    <h2>Get In Touch</h2>
    <form class="contact-form" action="https://formspree.io/f/xenqarq" method="POST">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit" class="submit-btn">Send Message</button>
    </form>
  </section>
  <footer>© <span id="year"></span> chrisproctor.org</footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
